<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <div class="card">
        <h2>Registro de Usuario</h2>
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
                <span class="error-msg" id="err-nombre">Solo letras permitidas.</span>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="text" id="correo" placeholder="correo@ejemplo.com">
                <span class="error-msg" id="err-correo">Formato de correo inválido.</span>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento">
                <span class="error-msg" id="err-fecha">Debes ser mayor de edad (18+).</span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (10 dígitos):</label>
                <input type="text" id="telefono" placeholder="5512345678">
                <span class="error-msg" id="err-telefono">Se requieren 10 dígitos numéricos.</span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Mín. 8 car, 1 mayús, 1 minús, 1 num, 1 especial">
                <span class="error-msg" id="err-password">Mínimo 8 caracteres, mayúscula, minúscula, número y carácter especial.</span>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <div class="modal-overlay" id="modalEdad">
        <div class="modal-content">
            <h3>¡Registro Exitoso!</h3>
            <p id="modalTextoEdad"></p>
            <p id="modalTextoTel"></p>
            <button id="btnIrLogin">Continuar al Login</button>
        </div>
    </div>

    <script src="js/utileria.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
